[package]
name = "client"
version = "1.0.0"
edition = "2024"

[dependencies]
audiopus = "0.2.0"
base64 = "0.23.1"
bytes = "1.12.1"
cpal = "0.18.1"
futures-util = "0.3.34"
ring = "0.17.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
webrtc = "0.17.1"
zeroize = { version = "1.8.1", features = ["derive"] }
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand = "0.8"
rfd = "0.14"
iced = { version = "0.14.0", features = ["tokio", "image", "canvas"] }
nnnoiseless = { version = "0.5.2", default-features = false }
dirs = "7.0.0"
region = "3.0"
secrecy = "0.8"
chrono = "0.4.45"
lazy_static = "1.5.0"

kira = "0.12.5"
open = "5.4.4"
image = "0.25.10"
[[bin]]
name = "Kakolookiyam"
path = "src/main.rs"

[build-dependencies]
winres = "0.1.12"

[package.metadata.bundle]
name = "Kakolookiyam"
identifier = "com.kakolookiyam.client"
icon = ["assets/images/Kakolookiyam.icns", "assets/images/Kakolookiyam_logo.png"]
version = "1.0.0"
copyright = "Copyright (c) Kakolookiyam. All rights reserved."




[package.metadata.deb]
name = "kakolookiyam"
maintainer = "Kakolookiyam <contact@kakolookiyam.ch>"
copyright = "2026 Kakolookiyam"
license-file = ["../LICENSE", "4"]
extended-description = "Messagerie et appels P2P hautement securises et chiffres de bout en bout."
section = "net"
priority = "optional"
assets = [
    ["target/release/Kakolookiyam", "usr/bin/Kakolookiyam", "755"],
    ["assets/images/Kakolookiyam_logo.png", "usr/share/icons/hicolor/512x512/apps/Kakolookiyam_logo.png", "644"],
    ["assets/Kakolookiyam.desktop", "usr/share/applications/Kakolookiyam.desktop", "644"],
]
